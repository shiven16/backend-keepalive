name: Keep Backend Alive

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/10 * * * *'
  # Optional: Allow manual triggering from GitHub UI
  workflow_dispatch:

env:
  BACKEND_URL: https://studio448.onrender.com/health

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Backend Health Endpoint
        id: ping
        run: |
          echo "🏓 Pinging backend health API: $BACKEND_URL"
          echo "⏰ Time: $(date)"
          
          # Perform the ping with retries
          for i in {1..3}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 200 "$BACKEND_URL")
            
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Backend is alive! HTTP Status: $HTTP_STATUS (attempt $i)"
              echo "success=true" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "⚠️  Received HTTP Status: $HTTP_STATUS on attempt $i"
              if [ $i -lt 3 ]; then
                echo "⏳ Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done
          
          echo "❌ All ping attempts failed"
          echo "success=false" >> $GITHUB_OUTPUT
          exit 1
      
      - name: Report Success
        if: steps.ping.outputs.success == 'true'
        run: echo "🎉 Keep-alive ping successful at $(date)"
      
      - name: Report Failure
        if: failure()
        run: |
          echo "💥 Keep-alive failed after 3 attempts at $(date)"
          echo "🔍 Check your backend health endpoint manually"
